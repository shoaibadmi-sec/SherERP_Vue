name: Deep Finance Account Identity Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [320, 360, 390, 430, 768, 1024, 1280, 1440]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-finance-account-identity-browser.cjs
        env:
          DEEP_AUDIT_WIDTH: ${{ matrix.width }}
          DEEP_AUDIT_OUTPUT: .superpowers/deep-audit/account-identity/${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-finance-account-identity-${{ matrix.width }}
          path: .superpowers/deep-audit/account-identity/${{ matrix.width }}
          include-hidden-files: true
          if-no-files-found: error
