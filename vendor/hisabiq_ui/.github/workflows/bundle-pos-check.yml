name: Bundle POS Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  bundle-sale-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and validate bundle POS calculations
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test tests/bundleCart.test.ts tests/bundleDocuments.test.ts tests/bundleFulfillment.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Verify POS bundle sale preview and phone/tablet flow
        run: |
          node scripts/bundle-pos-browser.cjs
          node scripts/bundle-component-browser.cjs
