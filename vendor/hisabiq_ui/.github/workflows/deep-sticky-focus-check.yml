name: Deep Sticky Focus Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  focused-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-sticky-focus-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-sticky-focus-evidence
          path: .superpowers/deep-audit/sticky-focus
          if-no-files-found: error
