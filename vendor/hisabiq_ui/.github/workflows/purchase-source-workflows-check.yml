name: Purchase Source Workflows Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/purchaseSource.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/purchase-source-workflows-browser.cjs
      - run: npm run test:purchases
