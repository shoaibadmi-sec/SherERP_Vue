name: Authentication UI Preview Check

on:
  pull_request:
    paths:
      - 'src/features/auth/**'
      - 'src/App.tsx'
      - 'src/components/Input.tsx'
      - 'scripts/auth-login-browser.cjs'
      - 'scripts/auth-settings-browser.cjs'
      - 'src/settings/**'
      - 'src/navigation/erpNavigation.ts'
      - '.github/workflows/auth-ui-preview-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    name: Signup, login, recovery browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify auth UI states
        env:
          AUTH_SCREENSHOT_DIR: auth-ui-screenshots
        run: npm run test:auth-login
      - name: Verify in-app account security settings
        env:
          AUTH_SCREENSHOT_DIR: auth-ui-screenshots
        run: npm run test:auth-settings
      - name: Publish review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hisabiq-auth-ui-screenshots
          path: auth-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14

      # This creates a separate Worker. It does not deploy the "hisabiq-ui"
      # production Worker and never calls the authentication backend.
      - name: Build isolated authentication UI preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/auth-login-design-20261022'
        run: npm run build

      - name: Publish isolated Cloudflare authentication UI preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/auth-login-design-20261022'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare preview not published: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets."
            exit 0
          fi
          npx wrangler deploy --name hisabiq-auth-preview
          echo "::notice::Deployed separate auth preview Worker; check the deployment URL above and open /#/login, /#/signup or /#/recovery."
