name: Bundle Editor Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  bundle-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify bundle recipe and cost unit tests
        run: node --experimental-strip-types --test tests/bundle*.test.ts
      - name: Verify bundle editor, mobile overlays, POS eye and lifecycle
        run: node scripts/bundle-editor-browser.cjs
