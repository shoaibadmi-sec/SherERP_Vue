name: Framer Motion Navigation Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:ui-contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:motion-navigation
      - run: npm run test:sidebar-interactions
      - run: node scripts/numeric-steppers-browser.cjs
      - run: npm run test:sidebar-target-size
      - run: npm run test:erp-navigation
      - run: npm run test:vendor-party-layout
