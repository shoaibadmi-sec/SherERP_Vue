name: Deep Cash Sessions Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  cash-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-cash-sessions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-cash-sessions-evidence
          path: .superpowers/deep-audit/cash-sessions
          if-no-files-found: error
