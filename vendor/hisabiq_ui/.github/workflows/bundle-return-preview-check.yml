name: Bundle Return Preview Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  returns:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and test whole Set returns
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test tests/bundleReturn.test.ts tests/salesDocuments.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Verify return dialog and no preview posting
        run: node scripts/bundle-return-browser.cjs
