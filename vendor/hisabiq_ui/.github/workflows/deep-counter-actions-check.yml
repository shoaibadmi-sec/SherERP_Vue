name: Deep Counter Actions Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/deep-counter-actions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-counter-actions-evidence
          path: .superpowers/deep-audit/counter-actions
          include-hidden-files: true
          if-no-files-found: error
