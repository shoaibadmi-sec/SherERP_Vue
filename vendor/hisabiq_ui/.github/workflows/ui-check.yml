name: UI Check

# Comprehensive regression suite. Fast pull-request checks live in pr-ci.yml.
# Run on demand before a release or during the scheduled nightly sweep.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

concurrency:
  group: ui-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check strict TypeScript
        run: npx tsc --noEmit

      - name: Lint authored UI source
        run: npm run lint

      - name: Enforce POS V2 design contract
        run: npm run check:ui-contract

      - name: Test UI helpers and theme palette
        run: npm test

      - name: Build UI
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Counter quick-clear, Bangla words and settlement
        run: npm run test:counter-ux

      - name: Check Bangla, English and bilingual POS and headers
        run: npm run test:bangla-ui

      - name: Check transaction workflow Bangla copy and safety notes
        run: npm run test:bangla-workflows

      - name: Check Bangla Reports, Daybook and isolated print HTML
        run: npm run test:bangla-reports-print

      - name: Check Bangla Audit, Accounts and Party statement UI
        run: npm run test:bangla-accounting

      - name: Check Bangla Finance and reconciliation across devices
        run: npm run test:bangla-finance

      - name: Check Bangla Cheques, Cash Sessions and Finance actions
        run: npm run test:bangla-finance-advanced

      - name: Check Phase 7 cash drawer in three language modes
        run: npm run test:bangla-cash-drawer

      - name: Check Phase 8 bilingual workspace shell across devices
        run: npm run test:bangla-workspace-shell

      - name: Check Phase 9 bilingual ERP SMS notifications preview
        run: npm run test:bangla-notifications

      - name: Check Phase 10 bilingual quotation print and editor
        run: npm run test:bangla-quotations

      - name: Check Phase 10 bilingual Vendor ledger statement
        run: npm run test:bangla-vendor-statement

      - name: Check Phase 11 bilingual Warranty case, filters and receipts
        run: npm run test:bangla-warranty

      - name: Check Phase 12 Online Sales order, COD and CRM Bangla
        run: npm run test:bangla-online-sales

      - name: Check Phase 13 multilingual fulfillment document print
        run: npm run test:bangla-fulfillment

      - name: Check Phase 14 Products catalog in three languages
        run: npm run test:bangla-products

      - name: Check Phase 15 Product Settings and Add/Edit localization
        run: npm run test:bangla-product-forms

      - name: Check Phase 16 Product inventory and offers localization
        run: npm run test:bangla-product-inventory

      - name: Check Phase 17 Sales, returns and customer credit language
        run: npm run test:bangla-sales

      - name: Check Phase 18 purchase list and source return language
        run: npm run test:bangla-purchases

      - name: Check Phase 19 Expenses in three languages
        run: npm run test:bangla-expenses

      - name: Check Phase 20 Party feedback in three languages
        run: npm run test:bangla-parties-feedback

      - name: Check Phase 21 Party Editor, opening and Detail in three languages
        run: npm run test:bangla-party-editor-detail

      - name: Check Phase 22 Party finance and statement language across devices
        run: npm run test:bangla-party-financial

      - name: Check Phase 23 Party directory and CSV import in three languages
        run: npm run test:bangla-party-directory-import

      - name: Check Phase 24 shared Excel CSV wizard in three languages
        run: npm run test:bangla-shared-import-wizard

      - name: Check Phase 25 localized import validation feedback
        run: npm run test:bangla-import-validation

      - name: Check Phase 26 Party ledger table and row actions across languages
        run: npm run test:bangla-party-ledger-table

      - name: Check Phase 27 shared calendar in three languages and screen sizes
        run: npm run test:bangla-shared-date-picker

      - name: Check Phase 29 measured Party and header accessibility fixes
        run: npm run test:phase29-accessible-names

      - name: Check rendered light and dark themes
        run: npm run test:theme

      - name: Check Vendor Party two-way ledger preview
        run: npm run test:vendor-workflow

      - name: Check POS Vendor unknown-price sourcing
        run: npm run test:vendor-pos

      - name: Check Vendor evening quote and replacement settlement
        run: npm run test:vendor-evening

      - name: Check Vendor in-context Issue memo and Purchase
        run: npm run test:vendor-context

      - name: Check Vendor source corrections, links and audit reversals
        run: npm run test:vendor-correction

      - name: Check top-level Vendor module, selector and tabs
        run: npm run test:vendor-module

      - name: Check Parties-style Vendor split layout and contextual actions
        run: npm run test:vendor-party-layout

      - name: Check Impeccable Dashboard and POS customer eligibility
        run: npm run test:impeccable-priority

      - name: Check compact single-panel Vendor memo/settlement across screen sizes
        run: node scripts/vendor-kiss-browser.cjs

      - name: Check shared Vendor Party profile
        run: npm run test:vendor-party-profile

      - name: Check inline Vendor goods cart
        run: npm run test:vendor-goods

      - name: Check atomic Vendor Clear Due with payment and products
        run: npm run test:vendor-clear-due

      - name: Check Vendor receipt uses one amount per payment account
        run: npm run test:vendor-receipt

      - name: Check task-centered ERP navigation and deep links
        run: npm run test:erp-navigation

      - name: Check tenant Settings hub and contextual entry
        run: npm run test:settings-hub

      - name: Check shared Excel CSV import wizard
        run: npm run test:import-wizard

      - name: Check Customer Supplier Excel CSV import
        run: npm run test:import-parties

      - name: Check Product import and opening stock
        run: npm run test:import-products

      - name: Check ERP SMS and quote-to-order fulfillment handoff
        run: npm run test:fulfillment-sms

      - name: Check Online Sales order, COD, CRM and SMS journeys
        run: npm run test:online-sales

      - name: Check calculator multiline, persistence and viewport visibility
        run: npm run test:calculator-scratchpad

      - name: Check shared POS compound quantity inputs and mobile geometry
        run: npm run test:compound-units

      - name: Check three-level product units, mobile layouts, POS and Purchase totals
        run: npm run test:multi-unit-products

      - name: Check quotations and estimates journeys
        run: npm run test:quotations

      - name: Check POS drag reorder and receipt order
        run: npm run test:pos-reorder

      - name: Check Party profile and CSV workflows
        run: npm run test:parties

      - name: Check date-filtered Party ledger and print
        run: npm run test:party-ledger

      - name: Check opening balances and semantic ledger impact
        run: npm run test:party-opening

      - name: Check Party payment correction and reversal
        run: npm run test:party-settlement

      - name: Check full-page purchase and quick-add workflow
        run: npm run test:purchases

      - name: Check product quick-add and price-unit interactions
        run: npm run test:product-quick-add

      - name: Check bundle recipe editor, versions, and mobile layouts
        run: node scripts/bundle-editor-browser.cjs

      - name: Check themed selects and date-range filters
        run: npm run test:themed-filters

      - name: Check SaaS administration journeys and contrast
        run: npm run test:saas

      - name: Check ERP settings workflows and contrast
        run: npm run test:settings
