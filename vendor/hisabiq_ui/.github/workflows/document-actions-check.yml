name: Document Actions Check
# Extended regression check; run manually from Actions.
on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --experimental-strip-types --test tests/salesDocuments.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/document-actions-browser.cjs
      - run: npm run build
      - run: node scripts/receipt-preview-browser.cjs
